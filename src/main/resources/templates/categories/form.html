<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <title>Category Form</title>
</head>
<body>
<section layout:fragment="content">
    <div class="container my-5">
        <h2 th:text="${category.id == null} ? 'Добавить категорию' : 'Редактировать категорию'"></h2>
        <form th:action="${category.id == null} ? @{/mvc/categories/add} : @{/mvc/categories/edit/{id}(id=${category.id})}"
              th:object="${category}" method="post">
            <div class="mb-3">
                <label for="name" class="form-label">Имя</label>
                <input type="text" class="form-control" id="name" th:field="*{name}" required>
                <div class="alert alert-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
            </div>
            <input type="hidden" th:field="*{id}" />
            <button type="submit" class="btn btn-primary">Сохранить</button>
            <a th:href="@{/mvc/categories}" class="btn btn-secondary">Отмена</a>
        </form>
    </div>
</section>
</body>
</html>
